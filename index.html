  --border:#ec489920; --border-hover:#ec489966;
  --text:#831843; --muted:#be185d;
  --accent:#ec4899; --accent-2:#a855f7; --gold:#f59e0b;
  --owned-1:#dcfce7; --owned-2:#bbf7d0; --owned-border:#22c55e55;
  --modal-1:#ffffff; --modal-2:#fff1f7; --modal-border:#ec489944;
  --overlay:rgba(131,24,67,.45);
  --shadow-card:0 18px 40px -18px rgba(236,72,153,.4);
  --logo-1:#ec4899; --logo-2:#a855f7;
}
[data-theme="mono"]{
  --bg-1:#3f3f46; --bg-2:#18181b;
  --header-bg:rgba(24,24,27,.92); --header-border:rgba(161,161,170,.2);
  --card-1:#27272a; --card-2:#18181b;
  --input-bg:#0f0f11; --btn-bg:#232326; --btn-hover:#2f2f33;
  --border:#ffffff14; --border-hover:#a1a1aa77;
  --text:#f4f4f5; --muted:#a1a1aa;
  --accent:#a1a1aa; --accent-2:#d4d4d8; --gold:#e4e4e7;
  --owned-1:#2a2a2e; --owned-2:#1a1a1d; --owned-border:#a1a1aa55;
  --modal-1:#27272a; --modal-2:#18181b; --modal-border:#a1a1aa44;
  --overlay:rgba(9,9,11,.85);
  --shadow-card:0 18px 40px -18px rgba(255,255,255,.15);

}
[data-theme="retro"]{
  --bg-1:#78350f; --bg-2:#2a1a08;
  --header-bg:rgba(45,25,10,.9); --header-border:rgba(217,180,120,.3);
  --card-1:#3d2510; --card-2:#1f1206;
  --input-bg:#180d04; --btn-bg:#2f1c0b; --btn-hover:#422711;
  --border:#d9b47820; --border-hover:#d9b47877;
  --text:#fef3c7; --muted:#c9a87a;
  --accent:#d97706; --accent-2:#a16207; --gold:#fde047;
  --owned-1:#365314; --owned-2:#1a2a08; --owned-border:#84cc1655;
  --modal-1:#3d2510; --modal-2:#1f1206; --modal-border:#d9770655;
  --overlay:rgba(15,8,0,.85);
  --shadow-card:0 18px 40px -18px rgba(217,119,6,.5);
  --logo-1:#d97706; --logo-2:#fde047;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 15% -10%, var(--bg-1) 0%, var(--bg-2) 55%) fixed;
  color:var(--text);min-height:100vh;padding-bottom:50px;overflow-x:hidden;
  transition:background .4s, color .3s;
}
h2{margin:0 0 14px;font-size:1.15rem}

/* HEADER */
header{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:12px 18px;background:var(--header-bg);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--header-border);transition:background .3s,border-color .3s;
}
.logo{font-weight:800;font-size:1.05rem;letter-spacing:.4px;
  background:linear-gradient(90deg,var(--logo-1),var(--logo-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
.coins{margin-left:auto;display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#3a2a10,#5c421a);
  border:1px solid #fbbf2455;padding:8px 16px;border-radius:999px;
  font-weight:800;color:#fbbf24;font-size:1rem;transition:transform .2s;}
.coins.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.icon-btn{background:var(--btn-bg);border:1px solid var(--border);color:var(--text);
  width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1.05rem;transition:.2s;}
.icon-btn:hover{background:var(--btn-hover)}

/* THEME PICKER */
.theme-wrap{position:relative}
.theme-menu{
  position:absolute;top:48px;right:0;z-index:100;
  background:var(--card-1);border:1px solid var(--border);
  border-radius:16px;padding:14px;width:250px;
  box-shadow:0 20px 50px -12px rgba(0,0,0,.6);
  display:none;grid-template-columns:repeat(5,1fr);gap:8px;
}
.theme-menu.open{display:grid;animation:fadeIn .2s}
.theme-swatch{
  width:38px;height:38px;border-radius:11px;cursor:pointer;
  border:2px solid transparent;position:relative;transition:.2s;
}
.theme-swatch:hover{transform:scale(1.12)}
.theme-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card-1)}
.theme-swatch.active::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:1rem;text-shadow:0 1px 3px #000c;
}

/* TABS */
.tabs{display:flex;gap:8px;padding:16px 18px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:11px 18px;border-radius:13px;
  border:1px solid var(--border);background:var(--btn-bg);color:var(--muted);
  font-weight:700;cursor:pointer;font-size:.88rem;transition:.2s;font-family:inherit;}
.tabs button:hover{color:var(--text);border-color:var(--border-hover)}
.tabs button.active{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%, #000));
  color:#fff;border-color:transparent;box-shadow:0 8px 24px -8px var(--accent);}
.tab-panel{display:none;padding:18px;max-width:900px;margin:0 auto}
.tab-panel.active{display:block;animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* JOB GRID */
.grid-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.job-tile{background:linear-gradient(160deg,var(--card-1),var(--card-2));
  border:1px solid var(--border);border-radius:20px;padding:22px 18px;
  text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden;}
.job-tile:hover{transform:translateY(-4px);border-color:var(--border-hover);box-shadow:var(--shadow-card)}
.job-emoji{font-size:3.2rem;line-height:1;margin-bottom:12px;
  filter:drop-shadow(0 6px 14px #0008);animation:floaty 3s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.job-name{font-weight:800;margin-bottom:6px;font-size:.98rem}
.job-desc{color:var(--muted);font-size:.78rem;line-height:1.4;margin-bottom:10px;min-height:2.2em}
.job-reward{color:var(--gold);font-weight:700;font-size:.82rem}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.shop-card{background:linear-gradient(160deg,var(--card-1),var(--card-2));
  border:1px solid var(--border);border-radius:20px;padding:20px 16px;text-align:center;
  transition:.25s;display:flex;flex-direction:column;}
.shop-card:hover{transform:translateY(-4px);border-color:var(--border-hover);box-shadow:var(--shadow-card)}
.shop-card.owned{border-color:var(--owned-border);
  background:linear-gradient(160deg,var(--owned-1),var(--owned-2))}
.toy-emoji{font-size:3.4rem;line-height:1;margin-bottom:12px;
  filter:drop-shadow(0 6px 14px #0008);transition:.2s}
.toy-name{font-weight:800;margin-bottom:6px;font-size:.98rem}
.toy-desc{color:var(--muted);font-size:.78rem;margin-bottom:14px;flex:1;line-height:1.4;min-height:3.6em}
.toy-actions{display:flex;gap:6px;flex-direction:column}
.buy-btn{width:100%;padding:11px;border-radius:12px;border:none;cursor:pointer;
  font-weight:800;font-size:.85rem;font-family:inherit;transition:.2s;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%, #000));color:#fff;}
.buy-btn:hover:not(:disabled){filter:brightness(1.15)}
.buy-btn:disabled{background:var(--btn-bg);color:var(--muted);cursor:default}
.shop-card.owned .buy-btn{background:linear-gradient(135deg,#22c55e,#15803d)}
.skin-btn{background:linear-gradient(135deg,#f59e0b,#d97706)!important;color:#2b1a00!important}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;
  font-size:.95rem;line-height:1.8}

/* SKINS */
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.skin-card{background:var(--btn-bg);border:1px solid var(--border);border-radius:16px;
  padding:14px;text-align:center;transition:.2s;}
.skin-card.active{border-color:#22c55e;background:var(--owned-2);box-shadow:0 0 20px -5px #22c55e66}
.skin-card.owned:not(.active){border-color:#fbbf2455}
.skin-card .skin-preview{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;
  box-shadow:inset -6px -8px 14px #00000055, 0 4px 12px #00000055;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.skin-name{font-weight:700;font-size:.82rem;margin-bottom:10px}
.skin-card .buy-btn{padding:8px;font-size:.75rem}

/* MODAL */
.modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:200;}
.modal.open{display:flex}
.modal-card{background:linear-gradient(160deg,var(--modal-1),var(--modal-2));
  border:1px solid var(--modal-border);border-radius:26px;padding:24px;
  max-width:640px;width:100%;max-height:92vh;overflow-y:auto;position:relative;
  box-shadow:0 30px 90px -20px rgba(0,0,0,.7);animation:modalIn .3s cubic-bezier(.34,1.4,.64,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:11px;
  background:var(--btn-bg);border:1px solid var(--border);color:var(--text);
  cursor:pointer;font-size:1rem;transition:.2s;z-index:5;}
.modal-close:hover{background:#f8717133;border-color:#f8717155}
#modalTitle{margin-bottom:16px;padding-right:40px}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin:14px 0 0}
.btn{padding:14px 28px;border-radius:14px;border:none;cursor:pointer;
  font-weight:800;font-size:.95rem;font-family:inherit;transition:.2s;
  background:linear-gradient(135deg,var(--accent-2),color-mix(in srgb,var(--accent-2) 70%, #000));
  color:#04222b;}
.btn:hover{transform:translateY(-2px)}

/* TOY GAMES */
.bubble-wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;
  padding:14px;background:var(--input-bg);border-radius:18px;user-select:none;}
.bubble{aspect-ratio:1;border-radius:50%;cursor:pointer;
  transition:transform .08s, background .2s;
  box-shadow:0 2px 6px #0008, inset 0 -3px 7px #00000055;}
.bubble:hover{transform:scale(1.08)}
.bubble:active{transform:scale(.9)}
.bubble.popped{background:radial-gradient(circle at 50% 50%, var(--card-1), var(--input-bg))!important;
  box-shadow:inset 0 3px 9px #000a;transform:scale(.84);opacity:.6;cursor:default;}
.bubble.popped:hover{transform:scale(.84)}
.toy-bar{display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;font-size:.85rem;color:var(--muted);font-weight:600;gap:10px;flex-wrap:wrap;}
.toy-bar button{padding:9px 16px;border-radius:11px;border:1px solid var(--border);
  background:var(--btn-bg);color:var(--text);font-weight:700;cursor:pointer;
  font-size:.8rem;font-family:inherit;transition:.2s;}
.toy-bar button:hover{border-color:var(--border-hover);background:var(--btn-hover)}

.spinner-wrap{display:flex;justify-content:center;align-items:center;height:280px}
.fidget{width:190px;height:190px;position:relative;cursor:pointer;will-change:transform}
.fidget .arm{position:absolute;left:50%;top:50%;width:76px;height:76px;border-radius:50%;
  border:5px solid #4c1d95;box-shadow:inset 0 -8px 14px #0006, inset 0 6px 12px #ffffff44;}
.fidget .arm:nth-child(1){transform:translate(-50%,-50%) rotate(0deg) translateY(-52px)}
.fidget .arm:nth-child(2){transform:translate(-50%,-50%) rotate(120deg) translateY(-52px)}
.fidget .arm:nth-child(3){transform:translate(-50%,-50%) rotate(240deg) translateY(-52px)}
.fidget .cap{position:absolute;left:50%;top:50%;width:58px;height:58px;
  margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #a5f3fc, #0891b2 60%, #155e75);
  border:5px solid #164e63;box-shadow:inset 0 -6px 12px #0006, 0 0 20px #22d3ee66;}

.ball-stage{display:flex;align-items:center;justify-content:center;height:300px}
.stress-ball{width:165px;height:165px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:3.4rem;
  cursor:pointer;user-select:none;transition:transform .13s cubic-bezier(.34,1.56,.64,1);}
.stress-ball.squeezed{transform:scale(.7,.78)}

.slime-stage{position:relative;height:320px;background:var(--input-bg);border-radius:20px;
  overflow:hidden;touch-action:none;cursor:crosshair;border:1px solid var(--border);
  background-image:radial-gradient(circle at 20% 30%, #ffffff08 1px, transparent 1px);
  background-size:26px 26px;}
.slime{position:absolute;left:0;top:0;width:124px;height:124px;
  margin:-62px 0 0 -62px;border-radius:46%;will-change:transform;pointer-events:none;}

.cat-stage{display:flex;align-items:center;justify-content:center;height:290px;position:relative}
.squish-cat{font-size:9rem;line-height:1;cursor:pointer;user-select:none;
  transition:transform .1s;filter:drop-shadow(0 12px 26px #0008);}
.squish-cat.squish{animation:catSquish .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes catSquish{
  0%{transform:scale(1,1)}22%{transform:scale(1.32,.68)}
  52%{transform:scale(.82,1.24)}78%{transform:scale(1.08,.94)}100%{transform:scale(1,1)}}
.float-text{position:absolute;pointer-events:none;font-weight:900;color:var(--gold);
  font-size:1.15rem;animation:floatUp .9s ease-out forwards;
  text-shadow:0 2px 10px #000a;z-index:5;}
@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,0) scale(.7)}
  100%{opacity:0;transform:translate(-50%,-80px) scale(1.25)}}

.popit-wrap{display:flex;justify-content:center;padding:10px 0}
.popit-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
  padding:16px;background:var(--input-bg);border-radius:22px;}

.cube-stage{display:flex;align-items:center;justify-content:center;height:300px;perspective:900px}
.cube-face{width:170px;height:170px;border-radius:26px;
  display:flex;align-items:center;justify-content:center;font-size:5rem;
  cursor:pointer;user-select:none;
  transition:transform .45s cubic-bezier(.34,1.4,.64,1);
  box-shadow:inset 0 -14px 26px #0006, inset 0 12px 26px #ffffff33, 0 22px 44px -10px #000a;}
.cube-face.flip{transform:rotateY(180deg) scale(.85)}

.sand-wrap{position:relative;height:320px;border-radius:20px;overflow:hidden;
  border:1px solid var(--border);cursor:crosshair;touch-action:none;}
#sandCanvas{display:block;width:100%;height:100%}

.inf-stage{display:flex;align-items:center;justify-content:center;height:320px;perspective:900px}
.inf-cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;
  transform:rotateX(-20deg) rotateY(-20deg);transition:transform .5s;}
.inf-cube.spin{animation:infSpin 3s linear infinite}
@keyframes infSpin{from{transform:rotateX(-20deg) rotateY(-20deg)}
  to{transform:rotateX(-20deg) rotateY(340deg)}}
.inf-cube .face{position:absolute;width:120px;height:120px;border-radius:14px;
  border:2px solid #00000044;opacity:.95;box-shadow:inset 0 0 30px #00000055;}

/* balloon */
.balloon-stage{display:flex;align-items:center;justify-content:center;height:320px;
  position:relative;overflow:hidden}
.balloon{font-size:6rem;line-height:1;cursor:pointer;user-select:none;
  transition:font-size .15s, transform .15s;transform-origin:center bottom;}
.balloon.pulse{animation:balloonPulse .3s ease-out}
@keyframes balloonPulse{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.balloon.burst{animation:burstOut .5s forwards}
@keyframes burstOut{to{opacity:0;transform:scale(2.5) rotate(30deg)}}

/* piano */
.piano-stage{padding:14px 0}
.piano{display:flex;justify-content:center;gap:4px;padding:14px;background:var(--input-bg);border-radius:18px}
.piano-key{width:44px;height:160px;border-radius:0 0 10px 10px;cursor:pointer;
  transition:transform .1s, filter .1s;border:none;font-family:inherit;
  box-shadow:inset 0 -8px 14px #00000044, 0 4px 8px #0006;}
.piano-key:active,.piano-key.playing{transform:translateY(4px) scale(.96);
  filter:brightness(1.2)}

/* magic ball */
.magic-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:340px;gap:20px}
.magic-ball{width:180px;height:180px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:4.5rem;
  background:radial-gradient(circle at 30% 25%, #312e81, #1e1b4b 45%, #0a0618);
  box-shadow:inset -14px -20px 40px #00000099, inset 14px 12px 30px #ffffff22,
    0 20px 50px -14px #4c1d95aa, 0 0 60px #4c1d9566;
  transition:transform .2s;}
.magic-ball:active{transform:scale(.94)}
.magic-ball.shake{animation:magicShake .5s}
@keyframes magicShake{
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-8px) rotate(-6deg)}
  40%{transform:translateX(8px) rotate(6deg)}
  60%{transform:translateX(-6px) rotate(-4deg)}
  80%{transform:translateX(6px) rotate(4deg)}}
.magic-answer{min-height:56px;padding:14px 22px;border-radius:16px;
  background:var(--input-bg);border:1px solid var(--border);
  font-weight:700;text-align:center;max-width:420px;
  color:var(--accent-2);transition:.25s;font-size:.95rem;}
.magic-answer.show{animation:ansIn .35s}
@keyframes ansIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* yoyo */
.yoyo-stage{position:relative;height:340px;border-radius:20px;
  background:var(--input-bg);overflow:hidden;border:1px solid var(--border);
  touch-action:none;cursor:ns-resize;}
.yoyo-string{position:absolute;left:50%;top:0;width:2px;
  background:linear-gradient(to bottom, var(--muted), var(--accent-2));}
.yoyo{position:absolute;left:50%;width:64px;height:64px;border-radius:50%;
  margin-left:-32px;margin-top:-32px;display:flex;align-items:center;justify-content:center;
  font-size:2rem;will-change:top;
  box-shadow:inset -8px -10px 18px #00000055, 0 0 30px currentColor;}

/* JOB GAMES */
.job-area{position:relative;height:320px;background:var(--input-bg);border-radius:20px;
  overflow:hidden;border:1px solid var(--border);}
.job-area .box{position:absolute;font-size:2.4rem;cursor:pointer;user-select:none;
  transition:transform .15s, opacity .2s;}
.job-area .box:active{transform:scale(1.3)!important}
.job-result{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:14px;padding:20px;text-align:center;}
.job-result .big{font-size:3.4rem}
.job-result .reward{font-size:1.5rem;font-weight:900;color:#4ade80}

.hold-btn{width:220px;height:220px;border-radius:50%;border:none;cursor:pointer;
  font-size:1.1rem;font-weight:900;font-family:inherit;color:#04222b;
  transition:transform .08s;user-select:none;
  background:radial-gradient(circle at 34% 28%, #a5f3fc, #0891b2 55%, #155e75);
  box-shadow:0 20px 50px -12px #22d3eeaa, inset 0 -12px 26px #0004;}
.hold-btn:active,.hold-btn.holding{transform:scale(.94);filter:brightness(1.2)}
.hold-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0}

.target-area{position:relative;height:320px;background:var(--input-bg);border-radius:20px;
  overflow:hidden;border:1px solid var(--border);touch-action:none;}
.target{position:absolute;font-size:2.6rem;cursor:pointer;user-select:none;transition:transform .1s;}
.target:active{transform:scale(.8)}
.spots-area{position:relative;height:320px;background:var(--input-bg);
  border-radius:20px;overflow:hidden;border:1px solid var(--border);cursor:crosshair;}
.spot{position:absolute;width:62px;height:62px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #8b6b3e, #4a3416);
  box-shadow:inset -6px -8px 14px #00000066, 0 4px 12px #00000055;
  transition:transform .15s, opacity .2s;}
.spot:active{transform:scale(.8)}

.react-area{height:320px;background:var(--input-bg);border-radius:20px;position:relative;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);}
.react-btn{position:absolute;padding:18px 26px;border-radius:16px;border:none;
  cursor:pointer;font-weight:900;font-size:1rem;font-family:inherit;
  background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;
  box-shadow:0 12px 30px -10px #22c55eaa;
  animation:reactPop .15s cubic-bezier(.34,1.56,.64,1);}
.react-btn.bad{background:linear-gradient(135deg,#ef4444,#991b1b);
  box-shadow:0 12px 30px -10px #ef4444aa;}
@keyframes reactPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.code-area{height:320px;background:var(--input-bg);border-radius:20px;position:relative;
  overflow:hidden;border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.code-symbol{font-family:'Courier New',monospace;font-size:4.5rem;font-weight:900;
  color:#4ade80;text-shadow:0 0 30px #4ade8088;animation:codePop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes codePop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.code-keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:0 12px}
.code-keys button{width:62px;height:62px;border-radius:14px;border:1px solid var(--border);
  background:var(--btn-bg);color:#4ade80;font-family:'Courier New',monospace;
  font-size:1.6rem;font-weight:900;cursor:pointer;transition:.15s;}
.code-keys button:hover{background:var(--btn-hover);transform:scale(1.06)}
.code-keys button:active{transform:scale(.9)}

.cook-area{height:320px;background:var(--input-bg);border-radius:20px;padding:18px;
  border:1px solid var(--border);display:flex;flex-direction:column;gap:14px;}
.recipe{background:var(--btn-bg);border-radius:14px;padding:12px;text-align:center;
  font-size:1.8rem;letter-spacing:6px;min-height:60px;color:var(--text);}
.recipe .done{opacity:.35}
.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}
.ingredients button{background:var(--btn-bg);border:1px solid var(--border);border-radius:14px;
  font-size:2.4rem;cursor:pointer;transition:.15s;font-family:inherit;color:var(--text);}
.ingredients button:hover{border-color:#fbbf2455;background:var(--btn-hover)}
.ingredients button:active{transform:scale(.92)}

.music-area{height:320px;background:var(--input-bg);border-radius:20px;position:relative;
  overflow:hidden;border:1px solid var(--border);}
.lane{position:absolute;top:0;bottom:0;width:33.33%;border-right:1px solid var(--border);}
.lane:last-of-type{border-right:none}
.lane-zone{position:absolute;bottom:0;left:0;right:0;height:88px;
  background:linear-gradient(to top, #22c55e44, transparent);border-top:2px solid #22c55e88;}
.note{position:absolute;width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  transform:translateX(-50%);pointer-events:none;
  box-shadow:0 0 22px currentColor, inset 0 -4px 8px #0006;}
.lane-btn{position:absolute;bottom:6px;width:80px;height:64px;border-radius:14px;
  border:2px solid var(--border);background:var(--btn-bg);color:var(--text);font-size:1.6rem;
  cursor:pointer;font-family:inherit;transform:translateX(-50%);transition:.1s;}
.lane-btn:active{transform:translateX(-50%) scale(.9);background:#22c55e44}

.lib-area{height:320px;background:var(--input-bg);border-radius:20px;padding:18px;
  border:1px solid var(--border);display:grid;
  grid-template-columns:repeat(4,1fr);gap:10px;align-content:center;}
.lib-card{aspect-ratio:.8;border-radius:14px;cursor:pointer;
  background:linear-gradient(160deg,#4c1d95,#2e1065);border:1px solid #a855f744;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  transition:transform .25s, background .25s;}
.lib-card:hover{transform:translateY(-3px)}
.lib-card.flipped{background:linear-gradient(160deg,#fbbf24,#d97706);color:#2b1a00}
.lib-card.matched{background:linear-gradient(160deg,#22c55e,#15803d);
  cursor:default;opacity:.7}

/* fishing */
.fish-area{height:320px;background:var(--input-bg);border-radius:20px;
  position:relative;overflow:hidden;border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;}
.fish-scale{position:relative;width:100%;max-width:400px;height:38px;border-radius:19px;
  background:linear-gradient(90deg, #1e3a8a, #0891b2, #22c55e, #eab308, #dc2626);
  border:2px solid var(--border);overflow:hidden;}
.fish-zone{position:absolute;top:0;bottom:0;background:#22c55e88;
  border-left:2px solid #4ade80;border-right:2px solid #4ade80;
  box-shadow:0 0 20px #4ade80aa;}
.fish-marker{position:absolute;top:-6px;bottom:-6px;width:5px;background:#fff;
  border-radius:3px;box-shadow:0 0 14px #fff, 0 0 4px #000;
  transform:translateX(-50%);}
.fish-emoji{font-size:4rem;animation:fishSwim 2s ease-in-out infinite}
@keyframes fishSwim{0%,100%{transform:translateX(-8px) rotate(-5deg)}
  50%{transform:translateX(8px) rotate(5deg)}}

/* photo */
.photo-area{position:relative;height:320px;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,#1e1b4b,#0a0618);border:1px solid var(--border);cursor:crosshair;}
.photo-target{position:absolute;font-size:2.6rem;cursor:pointer;
  transition:transform .1s;filter:drop-shadow(0 4px 10px #0009);}
.photo-target:active{transform:scale(.85)}
.photo-frame{position:absolute;left:50%;top:50%;width:120px;height:120px;
  margin:-60px 0 0 -60px;border:3px dashed #fbbf24;border-radius:14px;
  pointer-events:none;box-shadow:0 0 30px #fbbf2455, inset 0 0 30px #fbbf2422;}
.photo-frame::before,.photo-frame::after{content:'';position:absolute;width:16px;height:16px;
  border:3px solid #fbbf24;border-radius:4px;}
.photo-frame::before{left:-6px;top:-6px;border-right:none;border-bottom:none}
.photo-frame::after{right:-6px;bottom:-6px;border-left:none;border-top:none}

/* trainer */
.trainer-area{height:320px;background:var(--input-bg);border-radius:20px;
  position:relative;overflow:hidden;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.trainer-btn{padding:24px 44px;border-radius:20px;border:none;cursor:pointer;
  font-size:1.5rem;font-weight:900;font-family:inherit;color:#04222b;
  background:radial-gradient(circle at 34% 28%, #fef08a, #facc15 55%, #a16207);
  box-shadow:0 16px 40px -12px #facc15aa, inset 0 -10px 20px #0004;
  transition:transform .08s;}
.trainer-btn:active{transform:scale(.92)}
.trainer-btn.hit{background:radial-gradient(circle at 34% 28%, #bbf7d0, #22c55e 55%, #15803d)}
.trainer-btn.miss{background:radial-gradient(circle at 34% 28%, #fecaca, #dc2626 55%, #7f1d3a)}
.trainer-btn.pulse{animation:beatPulse .5s}
@keyframes beatPulse{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}

/* chemist */
.chem-area{height:320px;background:var(--input-bg);border-radius:20px;
  padding:20px;border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:16px;justify-content:center;}
.chem-recipe{display:flex;gap:12px;font-size:2.2rem;padding:12px 20px;
  background:var(--btn-bg);border-radius:16px;border:1px solid var(--border);}
.chem-recipe span.done{opacity:.35}
.chem-recipe span{transition:.2s}
.chem-buttons{display:flex;gap:12px}
.chem-buttons button{width:68px;height:68px;border-radius:50%;border:2px solid var(--border);
  cursor:pointer;transition:.15s;font-size:1.6rem;}
.chem-buttons button:hover{transform:scale(1.08)}
.chem-buttons button:active{transform:scale(.92)}

/* pilot */
.pilot-area{position:relative;height:320px;overflow:hidden;border-radius:20px;
  background:linear-gradient(180deg,#020010,#0a0520);
  border:1px solid var(--border);cursor:crosshair;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.asteroid{position:absolute;font-size:2.4rem;cursor:pointer;
  transition:transform .1s;filter:drop-shadow(0 0 12px #f97316aa);}
.asteroid:active{transform:scale(.85)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;
  padding:13px 24px;border-radius:14px;font-weight:700;font-size:.9rem;
  box-shadow:0 14px 40px -10px #000c;z-index:400;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);}
.toast.bad{background:linear-gradient(135deg,#ef4444,#991b1b)}
.toast.out{opacity:0;transform:translate(-50%,14px);transition:.3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:520px){
  .bubble-wrap{gap:4px;padding:10px}
  .squish-cat{font-size:7rem}
  .logo{font-size:.9rem}
  .tabs button{padding:10px 14px;font-size:.8rem}
  .popit-grid{grid-template-columns:repeat(6,1fr);gap:6px}
  .cube-face{width:140px;height:140px}
  .skin-grid{grid-template-columns:repeat(2,1fr)}
  .theme-menu{width:210px;grid-template-columns:repeat(4,1fr)}
  .piano-key{width:34px;height:120px}
}
</style>
</head>
<body>

<header>
  <div class="logo">🧘 AntiStress</div>
  <div class="coins">🪙 <b id="coins">0</b></div>
  <div class="theme-wrap">
    <button class="icon-btn" id="themeBtn" title="Тема">🎨</button>
    <div class="theme-menu" id="themeMenu">
      <div id="themeSwatches" style="display:contents"></div>
    </div>
  </div>
  <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
</header>

<nav class="tabs">
  <button data-tab="work" class="active">💼 Работа</button>
  <button data-tab="shop">🛒 Магазин</button>
  <button data-tab="toys">🧸 Мои игрушки</button>
</nav>

<main>
  <section class="tab-panel active" id="tab-work">
    <h2>💼 Способы заработка</h2>
    <p style="color:var(--muted);font-size:.85rem;margin:0 0 16px">Выбери подработку и заработай монеты на антистрессы</p>
    <div class="grid-jobs" id="jobsGrid"></div>
  </section>
  <section class="tab-panel" id="tab-shop">
    <h2>🛒 Магазин антистрессов</h2>
    <div class="grid" id="shopGrid"></div>
  </section>
  <section class="tab-panel" id="tab-toys">
    <h2>🧸 Мои антистрессы</h2>
    <div class="grid" id="toysGrid"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <button class="modal-close" id="modalClose">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalStage"></div>
  </div>
</div>

<script>
/* ============================================================
   БАЗА
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd  = (a,b) => a + Math.random() * (b - a);

let audioCtx = null, soundOn = true;
function ac(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq, dur = 0.08, type = 'sine', vol = 0.1){
  if(!soundOn) return;
  try{
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }catch(e){}
}
function popSound(){
  if(!soundOn) return;
  try{
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(800 + Math.random()*500, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, c.currentTime + 0.09);
    g.gain.setValueAtTime(0.15, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.1);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.12);
  }catch(e){}
}

/* ============================================================
   СОХРАНЕНИЕ В БРАУЗЕРЕ
   ============================================================ */
const SAVE_KEY = 'antistress_save_v4';
function defaultState(){
  return {
    coins: 300,
    theme: 'dark',
    toys: { bubble: { skins:['classic'], active:'classic' } }
  };
}
let state = (() => {
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && p.toys) return Object.assign(defaultState(), p);
    }
    // миграция со старых версий
    for(const k of ['antistress_save_v3','antistress_save_v2']){
      const old = localStorage.getItem(k);
      if(old){
        const p = JSON.parse(old);
        if(p && p.toys) return Object.assign(defaultState(), p);
      }
    }
  }catch(e){}
  return defaultState();
})();
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
window.addEventListener('beforeunload', save);

function renderCoins(){ $('#coins').textContent = state.coins; }
function bumpCoins(){ const el = $('.coins'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function addCoins(n){ state.coins += n; save(); renderCoins(); bumpCoins(); }

function toast(msg, ok = true){
  const t = document.createElement('div');
  t.className = 'toast' + (ok ? '' : ' bad');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 1800);
}

/* ============================================================
   ТЕМЫ
   ============================================================ */
const THEMES = [
  { id:'dark',      name:'Тёмная',      preview:'linear-gradient(135deg,#a855f7,#22d3ee)' },
  { id:'light',     name:'Светлая',     preview:'linear-gradient(135deg,#6366f1,#0ea5e9)' },
  { id:'neon',      name:'Неон',        preview:'linear-gradient(135deg,#ff00ff,#00ffff)' },
  { id:'sunset',    name:'Закат',       preview:'linear-gradient(135deg,#f97316,#facc15)' },
  { id:'ocean',     name:'Океан',       preview:'linear-gradient(135deg,#0ea5e9,#67e8f9)' },
  { id:'forest',    name:'Лес',         preview:'linear-gradient(135deg,#22c55e,#a3e635)' },
  { id:'cyberpunk', name:'Киберпанк',   preview:'linear-gradient(135deg,#ec4899,#22d3ee)' },
  { id:'candy',     name:'Карамель',    preview:'linear-gradient(135deg,#ec4899,#a855f7)' },
  { id:'mono',      name:'Монохром',    preview:'linear-gradient(135deg,#d4d4d8,#52525b)' },
  { id:'retro',     name:'Ретро',       preview:'linear-gradient(135deg,#d97706,#fde047)' },
];

function applyTheme(id){
  if(!THEMES.find(t => t.id === id)) id = 'dark';
  document.documentElement.setAttribute('data-theme', id);
  state.theme = id;
  save();
  renderThemeSwatches();
}

function renderThemeSwatches(){
  const box = $('#themeSwatches');
  box.innerHTML = '';
  THEMES.forEach(t => {
    const sw = document.createElement('div');
    sw.className = 'theme-swatch' + (state.theme === t.id ? ' active' : '');
    sw.style.background = t.preview;
    sw.title = t.name;
    sw.onclick = () => {
      applyTheme(t.id);
      beep(680, 0.08, 'sine', 0.07);
      toast(`Тема: ${t.name} 🎨`);
    };
    box.appendChild(sw);
  });
}

$('#themeBtn').onclick = e => {
  e.stopPropagation();
  $('#themeMenu').classList.toggle('open');
  beep(560, 0.05, 'sine', 0.05);

function getToy(id){ return TOYS.find(t => t.id === id); }
function getSkin(toy, skinId){ return toy.skins.find(s => s.id === skinId); }
function isOwned(id){ return !!state.toys[id]; }
function activeSkin(toyId){
  const owned = state.toys[toyId];
  const toy = getToy(toyId);
  return getSkin(toy, owned.active) || toy.skins[0];
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
let modalCleanup = null;
function closeModal(){
  if(modalCleanup){ try{ modalCleanup(); }catch(e){} modalCleanup = null; }
  $('#modal').classList.remove('open');
  $('#modalStage').innerHTML = '';
}
$('#modalClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function openModal(title){
  $('#modalTitle').textContent = title;
  $('#modalStage').innerHTML = '';
  $('#modal').classList.add('open');
  modalCleanup = null;
  return new Promise(r => requestAnimationFrame(() => r()));
}

async function openJob(jobId){
  const job = JOBS.find(j => j.id === jobId);
  if(!job) return;
  await openModal(`${job.emoji} ${job.name}`);
  const stage = $('#modalStage');
  const renderer = JOB_RENDERERS[jobId];
  if(renderer){
    const cleanup = renderer(stage, addCoins);
    if(typeof cleanup === 'function') modalCleanup = cleanup;
  }
}

JOB_RENDERERS.courier = (stage, onDone) => {
  stage.innerHTML = `<div class="target-area" id="a"></div>
    <div class="toy-bar"><span id="t">⏱ 6.0 с</span><span id="s">💰 0</span></div>`;
  const area = stage.querySelector('#a'), tEl = stage.querySelector('#t'), sEl = stage.querySelector('#s');
  let score = 0, alive = true, raf = null;
  const DUR = 6000, start = performance.now();
  const target = document.createElement('div');
  target.className = 'target'; target.textContent = '📦';
  let tx = 100, ty = 100, vx = 2.2, vy = 1.8;
  target.onclick = () => {
    if(!alive) return;
    score += 5; sEl.textContent = `💰 ${score}`;
    beep(600+Math.random()*300, .06, 'square', .06);
    const r = area.getBoundingClientRect();
    tx = rnd(20, r.width-60); ty = rnd(20, r.height-60);
    vx = rnd(-2.6,2.6)||2; vy = rnd(-2.4,2.4)||2;
  };
  area.appendChild(target);
  function loop(now){
    if(!alive) return;
    const r = area.getBoundingClientRect();
    tx += vx; ty += vy;

    if(ty<4 || ty>r.height-56){ vy*=-1; ty = Math.max(4,Math.min(r.height-56,ty)); }
    target.style.left = tx+'px'; target.style.top = ty+'px';
    const left = Math.max(0, DUR-(now-start));
    tEl.textContent = `⏱ ${(left/1000).toFixed(1)} с`;
    if(left<=0){ finish(); return; }
    raf = requestAnimationFrame(loop);
  }
  function finish(){
    if(!alive) return; alive=false; if(raf) cancelAnimationFrame(raf);
    onDone(score); beep(700,.1); setTimeout(()=>beep(950,.16),110);
    area.innerHTML = resultHTML('🚴', score, 'Все посылки доставлены!'); bindClose(area);

  return () => { alive=false; if(raf) cancelAnimationFrame(raf); };
};

        if(y >= r.height-130 && y <= r.height-20){
          hit = true; score+=5; sEl.textContent=`💰 ${score}`;
          beep(600+i*200,.07,'triangle',.09); n.remove();
        }
      });
      if(!hit) beep(200,.06,'sawtooth',.04);
      b.style.background = hit ? '#22c55e33' : '#f8717133';
      setTimeout(()=>{ b.style.background = 'var(--btn-bg)'; }, 120);
    };
    area.appendChild(b);
  }
  const notes = [];
  function spawn(){
    if(!alive) return;
    const lane = Math.floor(Math.random()*3);
    const el = document.createElement('div');
    el.className = 'note'; el.textContent = NOTES[Math.floor(Math.random()*NOTES.length)];
    el.style.left = (lane*33.33+16.66)+'%';
    el.style.background = `radial-gradient(circle at 34% 28%, #fff, ${COLORS[lane]} 60%, ${COLORS[lane]})`;
    el.style.color = COLORS[lane]; el.style.top = '-50px';
    el.dataset.lane = lane; el.dataset.y = -50;
    area.appendChild(el);
    notes.push({ el, y:-50, speed: 3.5+Math.random()*1.5 });
    setTimeout(()=>{ if(el.parentNode && alive){ el.style.opacity='0'; setTimeout(()=>el.remove(),200); } }, 4000);
    noteToId = setTimeout(spawn, 500+Math.random()*400);
  }
  spawn();
  function loop(now){
    if(!alive) return;
    notes.forEach(n => {
      if(!n.el.parentNode) return;
      n.y += n.speed; n.el.dataset.y = n.y; n.el.style.top = n.y+'px';
    });
    const left = Math.max(0, DUR-(now-start));
    tEl.textContent = `⏱ ${(left/1000).toFixed(1)} с`;
    if(left<=0){ finish(); return; }
    raf = requestAnimationFrame(loop);
  }
  function finish(){
    if(!alive) return; alive=false; if(raf) cancelAnimationFrame(raf); if(noteToId) clearTimeout(noteToId);
    onDone(score); beep(700,.1); setTimeout(()=>beep(950,.16),110);
    area.innerHTML = resultHTML('🎵', score, 'Концерт удался!');
    bindClose(area);
  }
  raf = requestAnimationFrame(loop);
  return () => { alive=false; if(raf) cancelAnimationFrame(raf); if(noteToId) clearTimeout(noteToId); };
};

/* Библиотекарь */
JOB_RENDERERS.librarian = (stage, onDone) => {
  const BOOKS = ['📕','📗','📘','📙','📔','📓'];
  const pairs = 4;
  const chosen = BOOKS.slice(0, pairs);
  const deck = [...chosen, ...chosen].sort(()=>Math.random()-.5);
  stage.innerHTML = `<div class="lib-area" id="a"></div>
    <div class="toy-bar"><span id="t">⏱ 20 с</span><span id="s">💰 0</span></div>`;
  const area = stage.querySelector('#a'), tEl = stage.querySelector('#t'), sEl = stage.querySelector('#s');
  let alive=true, score=0, left=20, flipped=[], matched=0, lock=false;
  deck.forEach((book, i) => {
    const c = document.createElement('div');
    c.className = 'lib-card'; c.dataset.book = book; c.dataset.i = i;
    c.innerHTML = '<span class="back">📖</span>';
    c.onclick = () => {
      if(!alive || lock || c.classList.contains('flipped') || c.classList.contains('matched')) return;
      c.classList.add('flipped'); c.textContent = book;
      beep(520+Math.random()*200,.05,'sine',.06);
      flipped.push(c);
      if(flipped.length === 2){
        lock = true;
        const [a,b] = flipped;
        if(a.dataset.book === b.dataset.book){
          setTimeout(() => {
            a.classList.add('matched'); b.classList.add('matched');
            a.textContent = b.textContent = '✅';
            matched++; score += 6; sEl.textContent = `💰 ${score}`;
            beep(800,.1); setTimeout(()=>beep(1000,.12),90);
            flipped=[]; lock=false;
            if(matched===pairs) setTimeout(()=>finish(true),300);
          }, 250);
        } else {
          setTimeout(() => {
            a.classList.remove('flipped'); b.classList.remove('flipped');
            a.innerHTML = '<span class="back">📖</span>';
            b.innerHTML = '<span class="back">📖</span>';
            flipped=[]; lock=false;
          }, 700);
        }
      }
    };
    area.appendChild(c);
  });
  const iv = setInterval(() => {
    if(!alive) return;
    left--; tEl.textContent = `⏱ ${left} с`;
    if(left<=0) finish(false);
  }, 1000);
  function finish(perfect){
    if(!alive) return; alive=false; clearInterval(iv);
    if(perfect) score += 15;
    onDone(score); beep(700,.1); setTimeout(()=>beep(950,.16),110);
    area.innerHTML = resultHTML(perfect ? '📚✨' : '📚', score, perfect ? 'Все пары найдены!' : 'Смена окончена');
    bindClose(area);
  }
  return () => { alive=false; clearInterval(iv); };
};

      const ex = parseFloat(el.style.left) + 20;

function renderShop(){
  const grid = $('#shopGrid');
  grid.innerHTML = '';
  TOYS.forEach(t => {
    const owned = isOwned(t.id);
    const card = document.createElement('div');
    card.className = 'shop-card' + (owned ? ' owned' : '');
    card.innerHTML = `
      <div class="toy-emoji">${t.emoji}</div>
      <div class="toy-name">${t.name}</div>
      <div class="toy-desc">${t.desc}</div>
      <div class="toy-actions">
        ${owned
          ? `<button class="buy-btn skin-btn" data-act="skins">🎨 Скины (${state.toys[t.id].skins.length}/${t.skins.length})</button>`
          : `<button class="buy-btn" data-act="buy">Купить · ${t.price} 🪙</button>`}
      </div>`;
    const btn = card.querySelector('button');
    if(owned) btn.onclick = () => openSkins(t.id);
    else btn.onclick = () => buyToy(t);
    grid.appendChild(card);
  });
}

function buyToy(t){
  if(state.coins < t.price){ toast('Не хватает монет!', false); beep(150,.18,'sawtooth',.07); return; }
  state.coins -= t.price;
  state.toys[t.id] = { skins:['classic'], active:'classic' };
  save();
  renderCoins(); bumpCoins(); renderShop(); renderToys();
  toast(`Куплено: ${t.name}! 🎉`);
  beep(680,.09); setTimeout(()=>beep(920,.14),100);
}

/* ============================================================
   МОИ ИГРУШКИ
   ============================================================ */
function renderToys(){
  const grid = $('#toysGrid');
  const owned = TOYS.filter(t => isOwned(t.id));
  if(!owned.length){
    grid.innerHTML = `<div class="empty">
      У тебя пока нет антистрессов 😢<br>
      Заработай монет на работе 💼 и купи их в магазине 🛒!
    </div>`;
    return;
  }
  grid.innerHTML = '';
  owned.forEach(t => {
    const ownedSkin = state.toys[t.id];
    const skin = getSkin(t, ownedSkin.active) || t.skins[0];
    const emoji = skin.emoji || t.emoji;
    const card = document.createElement('div');
    card.className = 'shop-card owned';
    card.innerHTML = `
      <div class="toy-emoji" style="
        color:${skin.colors.b};
        text-shadow: 0 0 26px ${skin.colors.b}88, 0 6px 14px #0008;
      ">${emoji}</div>
      <div class="toy-name">${t.name}</div>
      <div class="toy-desc">Нажми, чтобы поиграть</div>

        <button class="buy-btn" data-act="play">▶ Играть</button>
        <button class="buy-btn skin-btn" data-act="skins">🎨 Скины (${ownedSkin.skins.length}/${t.skins.length})</button>
      </div>`;
    card.querySelector('[data-act="play"]').onclick = e => { e.stopPropagation(); openToy(t.id); };
    card.querySelector('[data-act="skins"]').onclick = e => { e.stopPropagation(); openSkins(t.id); };
    grid.appendChild(card);
  });
}

/* ============================================================
   СКИНЫ
   ============================================================ */
async function openSkins(toyId){
  const toy = getToy(toyId);
  if(!toy) return;
  await openModal(`🎨 Скины: ${toy.name}`);
  const stage = $('#modalStage');
  const owned = state.toys[toyId];
  const grid = document.createElement('div');
  grid.className = 'skin-grid';

  toy.skins.forEach(skin => {
    const isSkinOwned = owned.skins.includes(skin.id);
    const isActive = owned.active === skin.id;
    const card = document.createElement('div');
    card.className = 'skin-card' + (isActive ? ' active' : '') + (isSkinOwned ? ' owned' : '');
    card.innerHTML = `
      <div class="skin-preview" style="
        background: radial-gradient(circle at 32% 26%, ${skin.colors.a}, ${skin.colors.b} 55%, ${skin.colors.c});
      ">${skin.emoji || ''}</div>
      <div class="skin-name">${skin.name}</div>
      ${ isActive
          ? `<button class="buy-btn" disabled>✓ Выбран</button>`
          : isSkinOwned
            ? `<button class="buy-btn" data-act="select">Выбрать</button>`
            : `<button class="buy-btn" data-act="buy">${skin.price} 🪙</button>` }
    `;
    const btn = card.querySelector('button');
    if(!isActive && isSkinOwned) btn.onclick = () => selectSkin(toyId, skin.id);
    else if(!isSkinOwned) btn.onclick = () => buySkin(toyId, skin);
    grid.appendChild(card);
  });

  stage.appendChild(grid);
}

function buySkin(toyId, skin){
  if(state.coins < skin.price){ toast('Не хватает монет!', false); beep(150,.18,'sawtooth',.07); return; }
  state.coins -= skin.price;
  state.toys[toyId].skins.push(skin.id);
  state.toys[toyId].active = skin.id;
  save();
  renderCoins(); bumpCoins(); renderShop(); renderToys();
  toast(`Скин «${skin.name}» куплен и выбран! 🎨`);
  beep(680,.09); setTimeout(()=>beep(920,.14),100);
  openSkins(toyId);
}

function selectSkin(toyId, skinId){
  state.toys[toyId].active = skinId;
  save();
  renderShop(); renderToys();
  beep(560,.06,'sine',.06);
  toast('Скин применён ✨');
  openSkins(toyId);
}

/* ============================================================
   ОТКРЫТИЕ ИГРУШКИ
   ============================================================ */
async function openToy(id){
  const toy = getToy(id);
  if(!toy || !isOwned(id)) return;
  const skin = activeSkin(id);
  await openModal(`${skin.emoji || toy.emoji} ${toy.name}`);
  const stage = $('#modalStage');
  const renderer = TOY_RENDERERS[id];
  if(renderer){
    const cleanup = renderer(stage, skin);
    if(typeof cleanup === 'function') modalCleanup = cleanup;
  }
}

TOY_RENDERERS.slime = (stage, skin) => {
  stage.innerHTML = `<div class="slime-stage" id="a"><div class="slime" id="el"></div></div>
    <p class="hint">Води пальцем — слайм потянется за тобой 🟣</p>`;
  const area = stage.querySelector('#a'), el = stage.querySelector('#el');
  el.style.background = `radial-gradient(circle at 33% 28%, ${skin.colors.a}, ${skin.colors.b} 46%, ${skin.colors.c})`;
  el.style.boxShadow = `inset -10px -14px 26px #00000055, 0 0 44px ${skin.colors.b}66`;
  let x = area.clientWidth/2, y = area.clientHeight/2, tx = x, ty = y, raf=null, alive=true;
  function setT(e){
    const r = area.getBoundingClientRect();
    tx = Math.max(20, Math.min(r.width-20, e.clientX-r.left));
    ty = Math.max(20, Math.min(r.height-20, e.clientY-r.top));
  }
  function dn(e){ area.setPointerCapture?.(e.pointerId); setT(e); beep(260,.06); }
  function mv(e){ if(e.buttons) setT(e); }
  area.addEventListener('pointerdown', dn);
  area.addEventListener('pointermove', mv);
  function loop(){
    if(!alive) return;
    const dx = tx-x, dy = ty-y;
    x += dx*.13; y += dy*.13;
    const sp = Math.hypot(dx,dy);
    const sx = 1 + Math.min(sp/240, .75);
    const sy = 1 - Math.min(sp/400, .45);
    const rot = Math.atan2(dy,dx)*180/Math.PI;
    el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sx}, ${sy})`;
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => {
    alive=false; if(raf) cancelAnimationFrame(raf);
    area.removeEventListener('pointerdown', dn);
    area.removeEventListener('pointermove', mv);
  };
};

TOY_RENDERERS.sand = (stage, skin) => {
  stage.innerHTML = `<div class="sand-wrap" id="w"><canvas id="c"></canvas></div>

      <button id="r">🔄 Разровнять</button>
    </div>`;
  const canvas = stage.querySelector('#c'), wrap = stage.querySelector('#w'), ctx = canvas.getContext('2d');
  function fill(){
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0, skin.colors.a); g.addColorStop(.5, skin.colors.b); g.addColorStop(1, skin.colors.c);
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  function resize(){ canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight; fill(); }
  let drawing = false;
  function draw(e){
    const r = canvas.getBoundingClientRect();
    const x = e.clientX-r.left, y = e.clientY-r.top;
    const g = ctx.createRadialGradient(x,y,2,x,y,24);
    g.addColorStop(0, skin.colors.c); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill();
  }
  function dn(e){ drawing = true; draw(e); }
  function up(){ drawing = false; }
  function mv(e){ if(drawing) draw(e); }
  canvas.addEventListener('pointerdown', dn);
  window.addEventListener('pointerup', up);
  canvas.addEventListener('pointermove', mv);
  stage.querySelector('#r').onclick = () => { fill(); beep(400,.08); };
  requestAnimationFrame(resize); setTimeout(resize, 50);
  return () => {
    canvas.removeEventListener('pointerdown', dn);

    canvas.removeEventListener('pointermove', mv);
  };
};

    const r = area.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    ty = Math.max(40, Math.min(r.height-40, clientY - r.top));
  }
  function onMove(e){ if(e.buttons || e.touches) setT(e); }
  function onDown(e){ setT(e); e.preventDefault?.(); }
  area.addEventListener('pointerdown', onDown);

  function loop(){
    if(!alive) return;
    y += (ty - y) * 0.22;
    yoyo.style.top = y + 'px';
    str.style.height = y + 'px';
    raf = requestAnimationFrame(loop);
  }
  loop();
  return () => {
    alive = false; if(raf) cancelAnimationFrame(raf);
    area.removeEventListener('pointerdown', onDown);
    area.removeEventListener('pointermove', onMove);
  };
};
